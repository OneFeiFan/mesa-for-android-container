name: Build Mesa for Jammy (Adreno 730/KGSL)

on:
  workflow_dispatch:
    inputs:
      mesa_version:
        description: 'Mesa Branch/Tag'
        required: true
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-24.04-arm  # 利用 24.04 的 ARM 算力
    container:
      image: arm64v8/ubuntu:22.04  # 强制在 22.04 容器内编译以保证 GLIBC 兼容

    steps:
      - name: Update System & Install Base
        run: |
          apt update
          apt install -y git build-essential python3-pip python3-mako \
                         bison flex libx11-dev libxext-dev libxdamage-dev \
                         libxfixes-dev libxcb-glx0-dev libxcb-dri2-0-dev \
                         libxcb-dri3-dev libxcb-present-dev libxshmfence-dev \
                         libxxf86vm-dev libxrandr-dev libwayland-dev \
                         wayland-protocols libwayland-egl-backend-dev \
                         libdrm-dev libx11-xcb-dev libxcb-shm0-dev \
                         libxcb-randr0-dev libexpat1-dev libsensors-dev \
                         llvm-15-dev clang-15 libclang-15-dev zlib1g-dev \
                         libvulkan-dev libzstd-dev

      - name: Install Modern Build Tools
        run: |
          # Jammy 默认的 meson 太旧，必须用 pip 安装新版
          pip3 install meson ninja mako

      - name: Clone Mesa Source
        run: |
          # 建议使用 mesa 官方库或带有 KGSL 补丁的仓库
          git clone --depth 1 -b ${{ github.event.inputs.mesa_version }} https://gitlab.freedesktop.org/mesa/mesa.git ~/mesa

      - name: Build and Install (The "Real" Config)
        run: |
          cd ~/mesa
          # 关键点：屏蔽掉导致 Jammy 报错的 Rust 依赖 (nouveau/rusticl)
          # 关键点：开启 Adreno 730 必需的 freedreno 和 turnip(vulkan)
          # 关键点：针对安卓内核开启 kgsl
          
          meson setup build/ \
          --prefix=/usr \
          --libdir=lib/aarch64-linux-gnu \
          -Dbuildtype=release \
          -Dplatforms=x11,wayland \
          -Dgallium-drivers=freedreno,zink,llvmpipe \
          -Dvulkan-drivers=freedreno \
          -Dfreedreno-kmds=kgsl,msm \
          -Dgallium-rusticl=false \
          -Dgallium-opencl=disabled \
          -Dllvm=enabled \
          -Dshared-llvm=enabled \
          -Dgles1=enabled \
          -Dgles2=enabled \
          -Dopengl=true \
          -Dgbm=enabled \
          -Degl=enabled \
          -Dglx=dri \
          -Dtools=freedreno

          ninja -C build/
          DESTDIR=$HOME/mesa_install ninja -C build/ install

      - name: Package to DEB
        run: |
          # 快速打包，不走复杂的 debian 源码流程，直接打二进制包
          mkdir -p ~/deb/DEBIAN
          cp -r ~/mesa_install/* ~/deb/
          cat <<EOF > ~/deb/DEBIAN/control
          Package: mesa-adreno-730-custom
          Version: 24.1.0-custom
          Section: libs
          Priority: optional
          Architecture: arm64
          Maintainer: GitHubActions
          Description: Custom Mesa build for Adreno 730 on Jammy (KGSL supported)
          EOF
          dpkg-deb --build ~/deb ~/mesa-custom-jammy-arm64.deb

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mesa-jammy-adreno730
          path: ~/mesa-custom-jammy-arm64.deb