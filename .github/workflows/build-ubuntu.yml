name: Build Ubuntu Packages (Jammy No-Rust Edition)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Branch or tag (e.g., main or specific branch)'
        required: true
        default: 'main'
      draft_release:
        description: 'Draft a new release'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04-arm

    steps:
      - name: Install dependencies
        run: |
          # 开启 deb-src，获取基础构建依赖
          sudo sed -i '/^# deb-src/s/^# //' /etc/apt/sources.list
          sudo apt update
          # 尝试安装默认构建依赖，允许部分失败
          sudo apt build-dep -y mesa || true
          
          # 移除 24.04 独有的包，保留 Jammy 可用的基础包
          sudo apt install -y git ccache build-essential devscripts fakeroot quilt git-buildpackage pristine-tar python3-pip libxfixes-dev libarchive-dev
          
          # 使用 pip 强刷最新版构建工具
          sudo pip3 install meson ninja

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-runner-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-runner-

      - name: Configure ccache
        run: |
          export CCACHE_DIR=~/.ccache
          ccache --max-size=2G
          ccache --zero-stats

      - name: Clone repository
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git clone -b ${{ github.event.inputs.tag }} --depth 1 https://github.com/lfdevs/mesa-for-android-container.git ~/mesa-for-android-container

      - name: 🚨 Hack Debian Packaging (Strip Rust)
        run: |
          cd ~/mesa-for-android-container
          echo "开始物理剔除 Rust 依赖..."
          # 从控制文件中删掉导致 Jammy 报错的包
          sed -i 's/librust-paste-dev,//g' debian/control
          sed -i 's/librust-syn-dev,//g' debian/control
          sed -i 's/bindgen,//g' debian/control
          sed -i 's/rustc,//g' debian/control
          sed -i 's/cargo,//g' debian/control
          
          echo "修改编译规则，禁用 Rust 相关的图形特性..."
          # 禁用 Rusticl 和涉及 Rust 的实验性 Vulkan 功能
          sed -i 's/-Dgallium-rusticl=true/-Dgallium-rusticl=false/g' debian/rules || true
          sed -i 's/-Dvulkan-beta=true/-Dvulkan-beta=false/g' debian/rules || true

      - name: Build Mesa
        shell: bash
        run: |
          export CCACHE_DIR=~/.ccache
          cd ~/mesa-for-android-container
          echo "Building Mesa in Jammy..."
          # 注意这里的 -d 参数极其关键：它告诉打包器忽略剩余的缺失依赖，强行开始编译
          gbp buildpackage -uc -us -jauto --git-ignore-branch -d

      - name: Save ccache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-runner-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Collect packages
        shell: bash
        run: |
          cd ~
          rm -f *dev* *dbgsym* libosmesa*.deb mesa-va-drivers*.deb mesa-vdpau-drivers*.deb
          if [[ "${{ github.event.inputs.tag }}" == *"turnip"* ]]; then
            find . -maxdepth 1 -type f -name "*.deb" ! -name "mesa-vulkan-drivers*" -delete
          fi
          echo "Calculating sha256 checksums..."
          find . -maxdepth 1 \( -name "*.deb" \) -type f -printf "%P\0" | xargs -0 sha256sum | sort -k2 > sha256sums.txt
          cat sha256sums.txt && echo

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mesa-for-android-container_${{ github.event.inputs.tag }}
          path: |
            ~/*.deb
            ~/sha256sums.txt
          retention-days: 90

  draft-release:
    if: ${{ github.event.inputs.draft_release == 'true' }}
    needs:
      - build
    runs-on: ubuntu-22.04-arm

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Build release notes with checksums
        shell: bash
        run: |
          set -euo pipefail
          checksums=$(find ./artifacts -type f -name "sha256sums.txt" -exec cat {} \; -exec echo \; | awk 'NF>=2 {print $1 "  " $2}' | sort -k2,2)
          cat <<'EOF' > release_body.md
          ## Checksums
          ```plaintext
          EOF
          printf '%s\n' "$checksums" >> release_body.md
          printf '%s\n' '```' >> release_body.md

      - name: Set release title
        shell: bash
        run: |
          version=$(find ./artifacts -name 'mesa-vulkan-drivers*.deb' -type f -print -quit | xargs basename | cut -d'_' -f2)
          if [[ "${{ github.event.inputs.tag }}" == *"turnip"* ]]; then
            echo "RELEASE_TITLE=turnip-${version}_ubuntu_jammy" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TITLE=${version}_ubuntu_jammy" >> "$GITHUB_ENV"
          fi

      - name: Upload archives to draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ env.RELEASE_TITLE }}
          draft: true
          body_path: release_body.md
          files: |
            ./artifacts/**/*.deb