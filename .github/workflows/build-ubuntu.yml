name: Build Mesa Adreno Full (Jammy Stable)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Mesa Branch/Tag (e.g. mesa-24.1.0)'
        required: true
        default: 'adreno-ubuntu-noble-updates'

jobs:
  build:
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Install Jammy Full Dependencies
        run: |
          sudo apt update
          # 补全 Jammy 版本的精准开发包
          sudo apt install -y python3-pip ninja-build gettext \
            libx11-dev libxext-dev libxdamage-dev libxfixes-dev \
            libxcb-glx0-dev libxcb-shm0-dev libxcb-dri2-dev \
            libxcb-dri3-dev libxcb-present-dev libxshmfence-dev \
            libxxf86vm-dev libxrandr-dev libwayland-dev wayland-protocols \
            libwayland-egl-backend-dev libclc-dev libelf-dev expat libxml2-dev \
            libzstd-dev libudev-dev \
            llvm-14-dev clang-14 libclang-14-dev # 开启 LLVM 支持以获得完整特性
          
          # 升级构建工具
          sudo pip3 install meson mako

      - name: Build Newest libdrm
        run: |
          git clone https://gitlab.freedesktop.org/mesa/drm.git --depth 1
          cd drm
          meson setup build -Dprefix=/usr -Dintel=disabled -Dradeon=disabled -Damdgpu=disabled -Dnouveau=disabled
          ninja -C build install
          cd ..

      - name: Clone Target Mesa
        run: |
          # 使用你指定的仓库，它通常包含针对 Android/KGSL 的优化补丁
          git clone -b ${{ github.event.inputs.tag }} --depth 1 https://github.com/lfdevs/mesa-for-android-container.git mesa_src

      - name: Full Feature Meson Build
        run: |
          cd mesa_src
          # 配置说明：
          # -Dllvm=enabled: 开启 LLVM 提高 Shader 兼容性
          # -Dgallium-drivers=freedreno: 开启 OpenGL 驱动
          # -Dvulkan-drivers=freedreno: 开启 Turnip Vulkan 驱动
          # -Dshared-glapi=enabled: 确保多个库之间共享 API 定义，增强稳定性
          meson setup build \
            -Dprefix=/opt/mesa-adreno \
            -Dplatforms=x11,wayland \
            -Dgallium-drivers=freedreno \
            -Dvulkan-drivers=freedreno \
            -Dbuildtype=release \
            -Doptimization=3 \
            -Dllvm=enabled \
            -Dshared-glapi=enabled \
            -Dgles1=enabled \
            -Dgles2=enabled \
            -Dopengl=enabled \
            -Dgbm=enabled \
            -Degl=enabled \
            -Dgallium-rusticl=false \
            -Dmicrosoft-clc=disabled
          ninja -C build install

      - name: Create Portable Release
        run: |
          mkdir -p release_bin/drivers
          cp -r /opt/mesa-adreno/* release_bin/drivers/
          
          cd release_bin
          
          # 增强版安装脚本：支持 ld.so.conf 优先级配置
          cat <<'EOF' > install.sh
          #!/bin/bash
          INSTALL_DIR="/usr/local/lib/mesa-adreno"
          echo "[1/3] 正在复制驱动文件到 $INSTALL_DIR..."
          sudo mkdir -p $INSTALL_DIR
          sudo cp -r ./drivers/* $INSTALL_DIR/
          
          echo "[2/3] 配置 Vulkan ICD 和环境变量..."
          sudo mkdir -p /etc/profile.d
          sudo bash -c "cat <<EOT > /etc/profile.d/mesa_adreno.sh
          # 优先使用 Turnip Vulkan
          export VK_ICD_FILENAMES=$INSTALL_DIR/share/vulkan/icd.d/freedreno_icd.aarch64.json
          # 确保系统能找到 EGL/GLES 库
          export LD_LIBRARY_PATH=$INSTALL_DIR/lib/aarch64-linux-gnu:\$LD_LIBRARY_PATH
          # 针对 Adreno 730 的特定优化建议（可选）
          export TU_DEBUG=sysmem 
          EOT"
          
          echo "[3/3] 刷新系统动态库路径优先级..."
          # 创建 ld 配置并将其设为高优先级
          sudo bash -c "echo '$INSTALL_DIR/lib/aarch64-linux-gnu' > /etc/ld.so.conf.d/000-mesa-adreno.conf"
          sudo ldconfig
          
          echo "=========================================="
          echo "安装成功！"
          echo "请执行: source /etc/profile.d/mesa_adreno.sh"
          echo "使用 'vulkaninfo' 或 'glxinfo' 检查 Adreno 730 是否识别。"
          echo "=========================================="
          EOF

          cat <<'EOF' > uninstall.sh
          #!/bin/bash
          INSTALL_DIR="/usr/local/lib/mesa-adreno"
          echo "正在清理驱动..."
          sudo rm -rf $INSTALL_DIR
          sudo rm -f /etc/profile.d/mesa_adreno.sh
          sudo rm -f /etc/ld.so.conf.d/000-mesa-adreno.conf
          sudo ldconfig
          echo "卸载完成，系统已恢复默认驱动。"
          EOF

          chmod +x install.sh uninstall.sh
          tar -czvf ../mesa-adreno-730-full-jammy.tar.gz .

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mesa-adreno-730-full-jammy
          path: mesa-adreno-730-full-jammy.tar.gz