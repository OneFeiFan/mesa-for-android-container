name: Build Mesa for Adreno 730 (Jammy Portable)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Mesa Branch/Tag'
        required: true
        default: 'main' # 建议用最新的以支持 A730

jobs:
  build:
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Install Base Build Tools
        run: |
          sudo apt update
          sudo apt install -y python3-pip ninja-build gettext libx11-dev libxext-dev libxdamage-dev \
                              libxfixes-dev libxcb-glx0-dev libxcb-shm0-dev libxcb-dri2-0-dev \
                              libxcb-dri3-0-dev libxcb-present-dev libxshmfence-dev libxxf86vm-dev \
                              libxrandr-dev libwayland-dev wayland-protocols libwayland-egl-backend-dev \
                              libclc-dev libelf-dev expat libxml2-dev
          # 升级 Meson 和 Mako (Jammy 默认版本过低)
          sudo pip3 install meson mako

      - name: Build Newest libdrm (Mesa 24+ Requirement)
        run: |
          git clone https://gitlab.freedesktop.org/mesa/drm.git --depth 1
          cd drm
          meson setup build -Dprefix=/usr -Dintel=disabled -Dradeon=disabled -Damdgpu=disabled -Dnouveau=disabled
          ninja -C build install
          cd ..

      - name: Clone Mesa
        run: |
          git clone -b ${{ github.event.inputs.tag }} --depth 1 https://gitlab.freedesktop.org/mesa/mesa.git

      - name: Compile Mesa (Adreno Only)
        run: |
          cd mesa
          # 核心配置：只编 freedreno 和 turnip，禁用 Rust 相关
          meson setup build \
            -Dprefix=/opt/mesa-adreno-730 \
            -Dplatforms=x11,wayland \
            -Dgallium-drivers=freedreno \
            -Dvulkan-drivers=freedreno \
            -Dbuildtype=release \
            -Dgallium-rusticl=false \
            -Dmicrosoft-clc=disabled \
            -Dllvm=disabled \
            -Dgles1=disabled \
            -Dgles2=enabled \
            -Dopengl=enabled \
            -Dgbm=enabled \
            -Degl=enabled
          ninja -C build install

      - name: Prepare Portable Package
        run: |
          mkdir -p release_package/drivers
          # 拷贝编译好的二进制产物
          cp -r /opt/mesa-adreno-730/* release_package/drivers/
          
          cd release_package
          
          # 1. 编写安装脚本
          cat <<'EOF' > install.sh
          #!/bin/bash
          DEST="/usr/local/lib/mesa-adreno"
          echo "正在安装 Adreno 730 优化版驱动到 $DEST ..."
          sudo mkdir -p $DEST
          sudo cp -r ./drivers/* $DEST/
          
          # 配置全局环境变量
          echo "配置环境变量..."
          sudo bash -c "cat <<EOT > /etc/profile.d/mesa_adreno.sh
          export VK_ICD_FILENAMES=$DEST/share/vulkan/icd.d/freedreno_icd.aarch64.json
          export LD_LIBRARY_PATH=$DEST/lib/aarch64-linux-gnu:\$LD_LIBRARY_PATH
          EOT"
          
          # 刷新动态库缓存
          sudo bash -c "echo '$DEST/lib/aarch64-linux-gnu' > /etc/ld.so.conf.d/mesa_adreno.conf"
          sudo ldconfig
          
          echo "安装完成！请重新打开终端或执行 'source /etc/profile.d/mesa_adreno.sh' 生效。"
          EOF

          # 2. 编写卸载脚本
          cat <<'EOF' > uninstall.sh
          #!/bin/bash
          DEST="/usr/local/lib/mesa-adreno"
          echo "正在卸载驱动并清理环境..."
          sudo rm -rf $DEST
          sudo rm -f /etc/profile.d/mesa_adreno.sh
          sudo rm -f /etc/ld.so.conf.d/mesa_adreno.conf
          sudo ldconfig
          echo "卸载成功。"
          EOF

          chmod +x install.sh uninstall.sh
          
          # 3. 打包
          tar -czvf ../mesa-adreno-730-jammy.tar.gz .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mesa-adreno-730-jammy
          path: mesa-adreno-730-jammy.tar.gz